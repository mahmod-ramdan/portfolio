name: Build & deploy to GitHub Pages

# Edit the site on the `source` branch. Every push builds the site
# and publishes the static output to the `main` branch, which GitHub Pages serves.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://mahmod-ramdan.github.io
          BASE_PATH: /portfolio
      - name: Publish dist/ to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./dist
          commit_message: "Deploy site from source"
