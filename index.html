<style>
  :root{
    --brand:#FF5A5F; --brand2:#6C4CF1; --brand3:#FFC93C; --brand4:#12B98C;
    --bg:#FFF7F0; --ink:#1B1524; --muted:#6A6377; --card:#FFFFFF;
    --line:rgba(27,21,36,.10);
    --grad:linear-gradient(120deg,var(--brand) 0%,var(--brand2) 100%);
    --grad2:linear-gradient(120deg,var(--brand2),var(--brand4));
    --shadow:0 26px 60px -26px rgba(27,21,36,.35);
    --radius:26px; --maxw:1140px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;background:var(--bg)}
  html:lang(ar) body{font-family:'Tajawal',system-ui,sans-serif}
  html:lang(en) body{font-family:'Poppins',system-ui,sans-serif}
  body{background:transparent;color:var(--ink);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .en{font-family:'Sora',sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  section{padding:88px 0;position:relative}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand2);background:color-mix(in srgb,var(--brand2) 12%,#fff);padding:7px 15px;border-radius:999px}
  .stitle{font-weight:900;font-size:clamp(28px,4.4vw,44px);line-height:1.2;letter-spacing:-.5px;margin:16px 0 14px}
  .lead{color:var(--muted);font-size:18px;max-width:680px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:13px 24px;border-radius:14px;cursor:pointer;border:2px solid transparent;transition:.22s;font-family:inherit;white-space:nowrap}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 16px 34px -14px var(--brand)}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}
  .blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;z-index:0;pointer-events:none}
  .bg-fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-fx .streak{position:absolute;border-radius:120px;filter:blur(72px);opacity:.42}
  .bg-fx .streak.s1{width:64vw;height:190px;top:6%;inset-inline-start:-12%;background:linear-gradient(90deg,var(--brand),var(--brand3));transform:rotate(-14deg);animation:drift1 20s ease-in-out infinite alternate}
  .bg-fx .streak.s2{width:58vw;height:160px;top:40%;inset-inline-end:-14%;background:linear-gradient(90deg,var(--brand2),var(--brand3));transform:rotate(11deg);animation:drift2 24s ease-in-out infinite alternate}
  .bg-fx .streak.s3{width:74vw;height:210px;bottom:4%;inset-inline-start:-8%;background:linear-gradient(90deg,var(--brand4),var(--brand));transform:rotate(-8deg);animation:drift1 28s ease-in-out infinite alternate}
  .bg-fx .blobfx{position:absolute;border-radius:50%;filter:blur(84px);opacity:.34}
  .bg-fx .blobfx.b1{width:340px;height:340px;top:-70px;inset-inline-end:5%;background:radial-gradient(circle,var(--brand3),transparent 66%);animation:floatx 16s ease-in-out infinite alternate}
  .bg-fx .blobfx.b2{width:300px;height:300px;bottom:12%;inset-inline-end:24%;background:radial-gradient(circle,var(--brand2),transparent 66%);animation:floaty 22s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translateY(34px) rotate(-9deg)}}
  @keyframes drift2{to{transform:translateY(-28px) rotate(15deg)}}
  @keyframes floatx{to{transform:translate(-26px,28px)}}
  @keyframes floaty{to{transform:translate(22px,-22px)}}
  @media (prefers-reduced-motion:reduce){.bg-fx .streak,.bg-fx .blobfx{animation:none}}

  header.nav{position:sticky;top:16px;z-index:60;margin-top:16px}
  .nav-in{max-width:var(--maxw);margin:0 auto;padding:10px 14px 10px 20px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px -18px rgba(27,21,36,.3)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:16px}
  .brand .mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:'Sora';font-weight:800;font-size:15px}
  .brand small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .nav-links{display:flex;gap:3px;align-items:center}
  .nav-links a{padding:9px 13px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--muted);transition:.2s}
  .nav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--brand) 10%,#fff)}
  .nav-actions{display:flex;align-items:center;gap:10px}
  .lang-btn{font-family:'Sora';font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 13px;cursor:pointer;transition:.2s}
  .lang-btn:hover{border-color:var(--brand)}
  .menu-btn{display:none;border:none;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}

  .hero{padding-top:48px}
  .hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:52px;align-items:center}
  .hero h1{font-weight:900;font-size:clamp(34px,5.2vw,58px);line-height:1.12;letter-spacing:-1px;margin:20px 0 18px}
  .hero .sub{color:var(--muted);font-size:18px;max-width:560px;margin-bottom:28px}
  .hero-cta{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:36px}
  .hero-stats{display:flex;gap:30px;flex-wrap:wrap}
  .hstat b{display:block;font-family:'Sora';font-weight:800;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hstat span{font-size:13px;color:var(--muted);font-weight:700}
  .hero-art{position:relative;z-index:1}
  .photo-frame{position:relative;border-radius:40% 40% 42% 42%/44% 44% 40% 40%;overflow:hidden;aspect-ratio:1/1.05;background:var(--grad2);box-shadow:var(--shadow);border:6px solid var(--card)}
  .photo-frame img{width:100%;height:100%;object-fit:cover}
  .photo-empty{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;padding:20px;font-size:15px;opacity:.92}
  .chip{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:3;display:flex;align-items:center;gap:9px}
  .chip .em{font-size:19px}
  .chip.t{top:14px;inset-inline-start:-18px}
  .chip.b{bottom:26px;inset-inline-end:-14px}
  .chip small{display:block;font-size:11px;color:var(--muted);font-weight:700}

  .strip{background:var(--ink);color:#fff;overflow:hidden;padding:16px 0}
  .marq{display:flex;gap:40px;white-space:nowrap;animation:marq 24s linear infinite;font-family:'Sora';font-weight:800;font-size:17px;letter-spacing:1px}
  .marq span{opacity:.92;display:inline-flex;gap:40px;align-items:center}
  .marq .dot{width:7px;height:7px;border-radius:50%;background:var(--brand3);display:inline-block}
  @keyframes marq{to{transform:translateX(-50%)}}

  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
  .about-photo{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/4.2;background:var(--grad2);box-shadow:var(--shadow)}
  .about-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .about-card h4{font-size:15px;color:var(--muted);font-weight:800;margin-bottom:14px}
  .factline{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;font-weight:600;padding:9px 0;border-bottom:1px solid var(--line)}
  .factline:last-child{border:none}
  .factline .ic{min-width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--brand2) 12%,#fff);display:grid;place-items:center;font-size:16px}

  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
  .svc{border-radius:var(--radius);padding:28px;color:#fff;min-height:200px;transition:.25s}
  .svc:hover{transform:translateY(-6px)}
  .svc .em{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:24px;margin-bottom:16px}
  .svc h3{font-size:19px;font-weight:900;margin-bottom:8px}
  .svc p{font-size:14.5px;opacity:.95}
  .svc:nth-child(3n+1){background:linear-gradient(140deg,var(--brand),#ff8a5c)}
  .svc:nth-child(3n+2){background:linear-gradient(140deg,var(--brand2),#9b6bff)}
  .svc:nth-child(3n+3){background:linear-gradient(140deg,var(--brand4),#3dd0a6)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
  .chips span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px}

  /* COMPANIES */
  .co{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-top:20px;transition:.25s}
  .co:hover{box-shadow:var(--shadow)}
  .co-top{display:grid;grid-template-columns:74px 1fr;gap:22px}
  .co-logo{width:74px;height:74px;border-radius:18px;display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:22px;color:#fff;overflow:hidden}
  .co-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .co:nth-child(6n+1) .co-logo{background:linear-gradient(140deg,var(--brand),#ff8a5c)}
  .co:nth-child(6n+2) .co-logo{background:linear-gradient(140deg,var(--brand2),#9b6bff)}
  .co:nth-child(6n+3) .co-logo{background:linear-gradient(140deg,var(--brand4),#3dd0a6)}
  .co:nth-child(6n+4) .co-logo{background:linear-gradient(140deg,#ff7a45,var(--brand3))}
  .co:nth-child(6n+5) .co-logo{background:linear-gradient(140deg,var(--brand2),var(--brand4))}
  .co:nth-child(6n+6) .co-logo{background:linear-gradient(140deg,var(--brand),var(--brand2))}
  .co-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:4px}
  .co-head h3{font-size:20px;font-weight:900}
  .co-role{color:var(--brand2);font-weight:800;font-size:14.5px}
  .co-meta{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .co-meta span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
  .co p.desc{color:var(--muted);font-size:15px;margin-bottom:10px}
  .co ul{list-style:none;display:grid;gap:6px}
  .co ul li{position:relative;padding-inline-start:20px;font-size:14.5px}
  .co ul li::before{content:"";position:absolute;inset-inline-start:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--brand4)}
  .co-work{margin-top:20px}
  .co-work h4{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .co-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .gitem{border:0;padding:0;cursor:zoom-in;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--bg);position:relative;box-shadow:0 10px 26px -16px rgba(27,21,36,.4)}
  .gitem img{width:100%;height:100%;object-fit:cover;transition:.3s}
  .gitem:hover img{transform:scale(1.06)}
  .co-videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
  .vitem{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:pointer;background:#0c0a12;display:block}
  .vitem>img{width:100%;height:100%;object-fit:cover;opacity:.92}
  .vitem .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:20px;padding-inline-start:4px;transition:.2s}
  .vitem:hover .play{background:var(--brand);transform:scale(1.08)}
  .vitem.vlink{display:grid;place-items:center;color:#fff;text-decoration:none}
  .vitem.vlink .play{position:static;margin:0}
  .vitem iframe,.co-vembed iframe{width:100%;height:100%;border:0;position:absolute;inset:0}
  .co-vembed{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
  .lightbox{position:fixed;inset:0;background:rgba(10,8,15,.92);z-index:200;display:none;place-items:center;padding:24px;cursor:zoom-out}
  .lightbox.open{display:grid}
  .lightbox img{max-width:94vw;max-height:92vh;border-radius:12px;box-shadow:0 30px 80px -20px #000}
  .lightbox .close{position:fixed;top:18px;inset-inline-end:22px;color:#fff;font-size:30px;font-weight:800;cursor:pointer;line-height:1}

  .cl-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
  .cl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px}
  .cl .d{width:10px;height:10px;border-radius:50%}
  .cl:nth-child(5n+1) .d{background:var(--brand)} .cl:nth-child(5n+2) .d{background:var(--brand2)}
  .cl:nth-child(5n+3) .d{background:var(--brand4)} .cl:nth-child(5n+4) .d{background:var(--brand3)} .cl:nth-child(5n+5) .d{background:#ff7a45}

  .cta-band{background:var(--grad);border-radius:34px;padding:50px;color:#fff;position:relative;overflow:hidden}
  .cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;position:relative;z-index:2}
  .cta-band .stitle{color:#fff} .cta-band .lead{color:rgba(255,255,255,.92)}
  .cinfo{display:grid;gap:12px;margin-top:20px}
  .cinfo a,.cinfo div{display:flex;align-items:center;gap:13px;font-weight:700;font-size:15.5px;color:#fff}
  .cinfo .ic{min-width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:19px}
  .cinfo small{display:block;font-size:12px;opacity:.85;font-weight:700}
  form.cform{background:var(--card);border-radius:var(--radius);padding:26px;color:var(--ink);box-shadow:var(--shadow)}
  .field{margin-bottom:14px}
  .field label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
  .field input,.field textarea{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:13px;padding:12px 15px;color:var(--ink);font-family:inherit;font-size:15px;transition:.2s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
  .field textarea{resize:vertical;min-height:84px}
  form.cform .btn{width:100%;justify-content:center}

  footer{text-align:center;padding:38px 0 30px;color:var(--muted);font-size:14px}
  footer .brand{justify-content:center;margin-bottom:12px}

  .fab{position:fixed;inset-block-end:22px;inset-inline-start:22px;z-index:80;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:14px 20px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 16px 34px -12px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;transition:.2s}
  .fab:hover{transform:translateY(-2px)}
  .dash-overlay{position:fixed;inset:0;background:rgba(20,15,28,.5);backdrop-filter:blur(2px);z-index:90;opacity:0;visibility:hidden;transition:.25s}
  .dash-overlay.open{opacity:1;visibility:visible}
  .dash{position:fixed;inset-block:0;inset-inline-end:0;width:430px;max-width:93vw;background:#fff;z-index:95;transform:translateX(110%);transition:transform .3s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
  html[dir=rtl] .dash{transform:translateX(-110%)}
  .dash.open{transform:translateX(0)!important}
  .dash-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff}
  .dash-head b{font-size:16px} .dash-head .x{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
  .dash-body{padding:14px 18px 40px;overflow-y:auto;flex:1}
  .acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .acc>button{width:100%;text-align:start;background:#fff;border:none;padding:14px 16px;font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .acc>.inner{padding:6px 16px 16px;display:none}
  .acc.open>.inner{display:block}
  .acc>button .ca{transition:.2s;color:var(--muted)} .acc.open>button .ca{transform:rotate(180deg)}
  .frow{margin-bottom:13px}

function migrate(){ /* upgrade older saved content to media[]+videos[] shape */
  try{(content.companies&&content.companies.items||[]).forEach(co=>{

    co.videos = co.videos.filter(Boolean);
    if("video" in co) delete co.video;
  });}catch(e){}
}

/* ============ VIDEO HELPERS ============ */
function ytid(url){if(!url)return null;let m;
  if((m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/|live\/)|youtube\.com\/.*[?&]v=)([\w-]{11})/)))return m[1];
  if(/^[\w-]{11}$/.test(url.trim()))return url.trim();
  return null;}
function vimeoid(url){if(!url)return null;const m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:null;}
function videoCard(v){const y=ytid(v);
  if(y)return `<div class="vitem" data-yt="${y}"><img src="https://img.youtube.com/vi/${y}/hqdefault.jpg" loading="lazy" alt=""><span class="play">▶</span></div>`;
  const vm=vimeoid(v);
  if(vm)return `<div class="co-vembed"><iframe src="https://player.vimeo.com/video/${vm}" allowfullscreen loading="lazy"></iframe></div>`;
  return `<a class="vitem vlink" href="${escA(v)}" target="_blank"><span class="play">▶</span></a>`;}

     img(state.lang==="ar"?"لوجو الشركة (PNG)":"Company logo (PNG)",`companies.items.${i}.logo`)
    +tx(state.lang==="ar"?"شعار بديل (حروف)":"Fallback initials",`companies.items.${i}.mark`)
    +bi(state.lang==="ar"?"اسم الشركة":"Company name",`companies.items.${i}.name`)
    +bi(state.lang==="ar"?"الدور":"Role",`companies.items.${i}.role`)
    +tx(state.lang==="ar"?"الفترة":"Period",`companies.items.${i}.period`)
    +bi(state.lang==="ar"?"النوع":"Type",`companies.items.${i}.type`)
    +bi(state.lang==="ar"?"الوصف":"Description",`companies.items.${i}.desc`,true)
    +listField(state.lang==="ar"?"النقاط":"Bullets",`companies.items.${i}.bullets`)
    +galleryEditor(i)+videosEditor(i));

  let cont=tx(UI[state.lang].cWhats+" (2010...)","contact.whatsapp")+tx(UI[state.lang].cEmail,"contact.email")+tx(UI[state.lang].cIn,"contact.linkedin")+bi(UI[state.lang].cLoc,"contact.location");

  $("#dashBody").innerHTML=[
    acc(state.lang==="ar"?"⚙️ الإعدادات والألوان":"⚙️ Settings & colors",settings,true),
    acc(state.lang==="ar"?"🚀 الهيرو":"🚀 Hero",hero),
    acc(state.lang==="ar"?"👤 نبذة":"👤 About",about),
    acc(state.lang==="ar"?"🧩 المهارات":"🧩 Skills",skills),
    acc(state.lang==="ar"?"💼 الشركات (لوجو + صور + فيديو)":"💼 Companies (logo + media)",comp),
    acc(state.lang==="ar"?"📞 التواصل":"📞 Contact",cont)
  ].join("");
}
function rep(arrPath,kind,itemFn){const arr=getP(content,arrPath)||[];
  return arr.map((it,i)=>`<div class="rep-item"><div class="rep-tools"><button type="button" class="mv" data-move="up" data-arr="${arrPath}" data-i="${i}"${i===0?" disabled":""}>▲</button><button type="button" class="mv" data-move="down" data-arr="${arrPath}" data-i="${i}"${i===arr.length-1?" disabled":""}>▼</button><button type="button" class="del" data-del="${arrPath}" data-i="${i}">✕</button></div><div class="lbl">#${i+1}</div>${itemFn(it,i)}</div>`).join("")
    +`<button type="button" class="addbtn" data-add="${arrPath}" data-kind="${kind}">+ ${state.lang==="ar"?"إضافة شركة":"Add company"}</button>`}
const BLANKS={
  company:()=>({mark:"NEW",logo:"",name:{ar:"شركة جديدة",en:"New company"},role:{ar:"الدور",en:"Role"},period:"2025",type:{ar:"",en:""},desc:{ar:"",en:""},bullets:{ar:[],en:[]},media:[],videos:[]}),
  video:()=>""
};

/* ============ EVENTS ============ */
function openDash(){
  if(content.settings.passcode && !state.unlocked){const p=prompt(state.lang==="ar"?"كلمة سر الداشبورد:":"Passcode:");if(p!==content.settings.passcode)return;state.unlocked=true;}
  renderEditor();$("#dash").classList.add("open");$("#dashOverlay").classList.add("open");
}
function closeDash(){$("#dash").classList.remove("open");$("#dashOverlay").classList.remove("open")}
$("#fab").onclick=openDash;$("#dashClose").onclick=closeDash;$("#dashOverlay").onclick=closeDash;
$("#langBtn").onclick=()=>{state.lang=state.lang==="ar"?"en":"ar";renderAll();if($("#dash").classList.contains("open"))renderEditor();};
$("#menuBtn").onclick=()=>$("#navLinks").classList.toggle("open");

const body=$("#dashBody");
body.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.list){setP(content,el.dataset.list,el.value.split("\n").map(s=>s.trim()).filter(Boolean));renderAll();save();return;}
  const p=el.dataset.path;if(!p)return;setP(content,p,el.value);renderAll();save();});
body.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.file&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{setP(content,el.dataset.file,r.result);save();renderAll();renderEditor();};r.readAsDataURL(el.files[0]);return;}
  if(el.dataset.fileadd&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{const arr=getP(content,el.dataset.fileadd);arr.push(r.result);save();renderAll();renderEditor();};r.readAsDataURL(el.files[0]);return;}
});
body.addEventListener("click",e=>{
  const t=e.target.closest(".acc-t");if(t){t.parentElement.classList.toggle("open");return;}
  const pal=e.target.closest("[data-pal]");if(pal){applyTheme(pal.dataset.pal);save();renderEditor();return;}
  const clr=e.target.closest("[data-clear]");if(clr){setP(content,clr.dataset.clear,"");save();renderAll();renderEditor();return;}
  const add=e.target.closest("[data-add]");if(add){const b=BLANKS[add.dataset.kind]?BLANKS[add.dataset.kind]():"";getP(content,add.dataset.add).push(b);save();renderEditor();renderAll();return;}
  const mv=e.target.closest("[data-move]");if(mv){const arr=getP(content,mv.dataset.arr),i=+mv.dataset.i,j=mv.dataset.move==="up"?i-1:i+1;if(j>=0&&j<arr.length){const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;save();renderEditor();renderAll();}return;}
  const del=e.target.closest("[data-del]");if(del){getP(content,del.dataset.del).splice(+del.dataset.i,1);save();renderEditor();renderAll();return;}
});
$("#dbSave").onclick=()=>{save();closeDash();};
$("#dbReset").onclick=()=>{if(confirm(state.lang==="ar"?"ترجع للنسخة الأصلية؟ هيتمسح تعديلك.":"Reset to default? Edits will be lost.")){content=clone(DEFAULT);migrate();applyTheme(content.settings.theme);save();renderAll();renderEditor();}};
$("#dbExport").onclick=()=>{closeDash();document.getElementById("fab").style.display="none";document.getElementById("content-data").textContent=JSON.stringify(content);const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;downloadFile("index.html",html,"text/html");syncFab();};
$("#dbJson").onclick=()=>downloadFile("mahmoud-portfolio-content.json",JSON.stringify(content,null,2),"application/json");
$("#dbImport").onclick=()=>$("#jsonInput").click();
$("#jsonInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{content=JSON.parse(r.result);migrate();applyTheme(content.settings.theme||"coral");save();renderAll();renderEditor();}catch(err){alert("Invalid JSON")}};r.readAsText(f);};
function downloadFile(name,data,type){const b=new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

boot();
</script>
</body>
</html>
